[project]
name = "podcast-recall"
version = "0.0.1"
description = "Local chat that answers questions from your podcast library with timestamped citations"
requires-python = ">=3.12"
dependencies = [
    "mlx-whisper",
    "google-auth-oauthlib",
    "google-api-python-client",
    "fastapi",
    "uvicorn",
    "keyring",
    "sqlite-vec>=0.1.9",
]

[project.scripts]
podcast-recall = "podcast_recall.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["podcast_recall"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
